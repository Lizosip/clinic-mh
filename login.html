<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для страницы входа */
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            background: #f4f0f8;
            padding: 40px 20px;
        }
        .login-container {
            background: white;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #232536;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #ffc107;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #232536;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-container button:hover {
            background: #e6a800;
        }
        #toggleMode {
            text-align: center;
            margin-top: 20px;
        }
        #toggleMode a {
            color: #6c42d9;
            text-decoration: none;
            font-weight: bold;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }
        #managerSection {
            margin-top: 20px;
            text-align: center;
        }
        #managerSection button {
            background: #6c42d9;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #managerSection button:hover {
            background: #532fb0;
        }
    </style>
</head>
<body>

    <!-- Хедер (общий) -->
    <header class="header">
        <div class="container">
            <div class="logo"><a href="index.html">Клиника MH</a></div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="blog.html">Услуги</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                    <li><a href="privacy.html">Документация</a></li>
                </ul>
            </nav>
            <a href="login.html" class="subscribe-btn">Войти</a>
        </div>
    </header>

    <section class="login-section">
        <div class="login-container">
            <h2 id="formTitle">Войти в аккаунт</h2>
            <form id="authForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Пароль" required>
                </div>
                <!-- Доп. поля для регистрации -->
                <div id="registerFields" style="display:none;">
                    <div class="form-group">
                        <input type="text" id="fullName" placeholder="Ваше полное имя (для врача — ФИО)">
                    </div>
                    <div class="form-group">
                        <select id="roleSelect">
                            <option value="client">Клиент</option>
                            <option value="doctor">Врач</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn">Войти</button>
            </form>
            <p id="toggleMode">
                <span id="toggleText">Нет аккаунта?</span>
                <a href="#" id="toggleLink">Создать аккаунт</a>
            </p>
            <p id="message"></p>
            <!-- Кнопка для менеджера (отправить пароль) -->
            <div id="managerSection" style="display:none;">
                <button id="sendManagerPasswordBtn">Отправить пароль менеджеру</button>
            </div>
        </div>
    </section>

    <!-- Футер (общий) -->
    <footer class="footer2">
        <div class="footer2-subscribe">
            <p class="footer2-subscribe-text">Оставьте свои данные для обратной связи по любому вопросу</p>
            <form class="footer2-subscribe-form">
                <input type="email" placeholder="Enter Your Email" required>
                <button type="submit">Отправить</button>
            </form>
        </div>
        <div class="footer2-bottom">
            <div class="footer2-info">Савульский переулок д.10<br>clinik_MH@finsweet.com 020 7993 2905</div>
            <div class="footer2-socials">
                <a href="#"><img src="photo/social/Negative.png" alt="Facebook"></a>
                <a href="#"><img src="photo/social/Negative_2.png" alt="Twitter"></a>
                <a href="#"><img src="photo/social/Negative_3.png" alt="Instagram"></a>
                <a href="#"><img src="photo/social/Vector.png" alt="LinkedIn"></a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { registerUser, loginUser } from './js/auth.js';
        import { sendManagerPassword } from './js/manager.js';

        const urlParams = new URLSearchParams(window.location.search);
        let mode = urlParams.get('mode') || 'login';

        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const registerFields = document.getElementById('registerFields');
        const message = document.getElementById('message');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const fullNameInput = document.getElementById('fullName');
        const roleSelect = document.getElementById('roleSelect');

        function setMode(newMode) {
            mode = newMode;
            if (mode === 'register') {
                formTitle.textContent = 'Создать аккаунт';
                submitBtn.textContent = 'Создать аккаунт';
                toggleText.textContent = 'Уже есть аккаунт?';
                toggleLink.textContent = 'Войти';
                registerFields.style.display = 'block';
                document.getElementById('managerSection').style.display = 'none';
            } else {
                formTitle.textContent = 'Войти в аккаунт';
                submitBtn.textContent = 'Войти';
                toggleText.textContent = 'Нет аккаунта?';
                toggleLink.textContent = 'Создать аккаунт';
                registerFields.style.display = 'none';
                document.getElementById('managerSection').style.display = 'block';
            }
        }

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            const newMode = (mode === 'login') ? 'register' : 'login';
            setMode(newMode);
            history.pushState({}, '', `?mode=${newMode}`);
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            message.textContent = '';
            message.style.color = 'red';

            if (mode === 'register') {
                const fullName = fullNameInput.value.trim();
                const role = roleSelect.value;
                if (!fullName) {
                    message.textContent = 'Введите полное имя';
                    return;
                }
                const result = await registerUser(email, password, role, fullName);
                if (result.success) {
                    message.style.color = 'green';
                    message.textContent = 'Аккаунт создан! Вход...';
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    message.textContent = result.error;
                }
            } else {
                const result = await loginUser(email, password);
                if (result.success) {
                    message.style.color = 'green';
                    message.textContent = 'Вход выполнен!';
                    setTimeout(() => window.location.href = 'index.html', 500);
                } else {
                    message.textContent = result.error;
                }
            }
        });

        document.getElementById('sendManagerPasswordBtn').addEventListener('click', async () => {
            const result = await sendManagerPassword();
            alert(result.message);
        });

        setMode(mode);
    </script>
</body>
</html>
