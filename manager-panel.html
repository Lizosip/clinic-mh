
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель менеджера</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .manager-section {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        .manager-section h1 {
            text-align: center;
            font-size: 32px;
            color: #232536;
        }
        .requests-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 30px;
        }
        .request-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-left: 6px solid #ffc107;
        }
        .client-info p {
            margin: 5px 0;
        }
        .manager-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }
        .manager-fields input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            flex: 1 0 180px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .action-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .confirm-btn { background: #2ecc71; color: white; }
        .confirm-btn:hover { background: #27ae60; }
        .contact-btn { background: #3498db; color: white; }
        .contact-btn:hover { background: #2980b9; }
        .cancel-btn { background: #e74c3c; color: white; }
        .cancel-btn:hover { background: #c0392b; }
        .empty-message { text-align: center; color: #888; font-size: 18px; margin-top: 40px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="logo"><a href="index.html">Клиника MH</a></div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="blog.html">Услуги</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                    <li><a href="privacy.html">Документация</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="manager-section">
        <h1>Заявки на запись</h1>
        <div id="requestsList" class="requests-list">
            <p class="empty-message">Загрузка...</p>
        </div>
    </section>

    <!-- Футер -->

    <script type="module">
        import { auth, db } from './js/firebase-init.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { collection, query, where, onSnapshot, doc, deleteDoc, getDocs, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getUserData } from './js/auth.js';
        import { renderHeader } from './js/ui.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            const userData = await getUserData(user.uid);
            if (userData.role !== 'manager') {
                alert('Доступ только для менеджеров');
                window.location.href = 'index.html';
                return;
            }
            renderHeader('manager');
            listenRequests();
        });

        function listenRequests() {
            const q = query(collection(db, "requests"), where("status", "==", "pending"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('requestsList');
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p class="empty-message">Нет новых заявок.</p>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.dataset.id = docSnap.id;
                    card.innerHTML = `
                        <div class="client-info">
                            <p><strong>Имя:</strong> ${data.clientName || 'Не указано'}</p>
                            <p><strong>Email:</strong> ${data.clientEmail}</p>
                            <p><strong>Возраст:</strong> ${data.clientAge || ''}</p>
                            <p><strong>Пожелания:</strong> ${data.message || ''}</p>
                        </div>
                        <div class="manager-fields">
                            <input type="text" class="doctor-name" placeholder="ФИО врача (логин)" required>
                            <input type="date" class="appointment-day" required>
                            <input type="time" class="appointment-time" required>
                            <input type="text" class="appointment-comment" placeholder="Комментарий менеджера">
                        </div>
                        <div class="action-buttons">
                            <button class="confirm-btn">✅ Подтвердить</button>
                            <button class="contact-btn">✉️ Связаться</button>
                            <button class="cancel-btn">❌ Отменить</button>
                        </div>
                    `;
                    list.appendChild(card);

                    // Обработчики
                    const confirmBtn = card.querySelector('.confirm-btn');
                    const contactBtn = card.querySelector('.contact-btn');
                    const cancelBtn = card.querySelector('.cancel-btn');

                    confirmBtn.addEventListener('click', async () => {
                        const doctorName = card.querySelector('.doctor-name').value.trim();
                        const day = card.querySelector('.appointment-day').value;
                        const time = card.querySelector('.appointment-time').value;
                        const comment = card.querySelector('.appointment-comment').value.trim();

                        if (!doctorName || !day || !time) {
                            alert('Заполните все поля: ФИО врача, день и время');
                            return;
                        }

                        // Проверка занятости
                        const busy = await checkDoctorBusy(doctorName, day, time);
                        if (busy) {
                            alert('Это время уже занято у данного врача. Выберите другое.');
                            return;
                        }

                        // Ищем врача по fullName
                        const usersRef = collection(db, "users");
                        const qDoctor = query(usersRef, where("fullName", "==", doctorName), where("role", "==", "doctor"));
                        const doctorSnap = await getDocs(qDoctor);
                        if (doctorSnap.empty) {
                            alert('Врач с таким ФИО не найден. Убедитесь, что врач зарегистрирован.');
                            return;
                        }
                        const doctorDoc = doctorSnap.docs[0];
                        const doctorUid = doctorDoc.id;

                        // Создаём запись в appointments
                        const appointmentData = {
                            clientId: data.clientId || null,
                            clientName: data.clientName || 'Гость',
                            clientEmail: data.clientEmail,
                            doctorId: doctorUid,
                            doctorName: doctorName,
                            day: day,
                            time: time,
                            comment: comment,
                            status: 'confirmed',
                            createdAt: new Date().toISOString()
                        };
                        await addDoc(collection(db, "appointments"), appointmentData);

                        // Удаляем заявку из requests
                        await deleteDoc(doc(db, "requests", docSnap.id));

                        alert('Запись подтверждена и добавлена в календарь врача и клиента.');
                    });

                    contactBtn.addEventListener('click', () => {
                        const email = data.clientEmail;
                        if (email) {
                            window.location.href = `mailto:${email}?subject=Запись на приём&body=Здравствуйте! Мы рассмотрели вашу заявку.`;
                        } else {
                            alert('Email клиента не указан');
                        }
                    });

                    cancelBtn.addEventListener('click', async () => {
                        if (confirm('Удалить эту заявку?')) {
                            await deleteDoc(doc(db, "requests", docSnap.id));
                            alert('Заявка удалена');
                        }
                    });
                });
            });
        }

        // Функция проверки занятости
        async function checkDoctorBusy(doctorName, day, time) {
            const appointmentsRef = collection(db, "appointments");
            const q = query(
                appointmentsRef,
                where("doctorName", "==", doctorName),
                where("day", "==", day),
                where("time", "==", time),
                where("status", "==", "confirmed")
            );
            const snap = await getDocs(q);
            return !snap.empty;
        }
    </script>
    <!-- Футер -->
    
 <!-- Header -->
    <header class="header">
        <div class="container">
            <!-- Логотип -->
            <div class="logo">
                <a href="#">Клиника MH</a>
            </div>
    
            <!-- Меню навигации -->
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#" onclick="window.location.href='index.html'">Главная</a></li>
                    <li><a href="#" onclick="window.location.href='blog.html'">Услуги</a></li>
                    <!-- <li><a href="#" onclick="window.location.href='about.html'">О нас Us</a></li> -->
                    <li><a href="#" onclick="window.location.href='contact.html'">Контакты</a></li>
                    <li><a href="#" onclick="window.location.href='privacy.html'">Документация</a></li>
                </ul>
            </nav>
        </div>
        <!-- Блок подписки -->
        <div class="footer2-subscribe">
            <p class="footer2-subscribe-text">Оставьте свои данные для обратной связи по любому вопросу</p>
            <form class="footer2-subscribe-form">
                <input type="email" placeholder="Enter Your Email" required>
                <button type="submit">Отправить</button>
            </form>
        </div>

        <!-- Нижняя часть футера -->
        <div class="footer2-bottom">
            <div class="footer2-info">
                Савульский переулок д.10<br>
                clinik_MH@finsweet.com 020 7993 2905
            </div>
            <div class="footer2-socials">
                <a href="#"><img src="photo/social/Negative.png" alt="Facebook"></a>
                <a href="#"><img src="photo/social/Negative_2.png" alt="Twitter"></a>
                <a href="#"><img src="photo/social/Negative_3.png" alt="Instagram"></a>
                <a href="#"><img src="photo/social/Vector.png" alt="LinkedIn"></a>
            </div>
        </div>
    </header>
</body>
</html>
